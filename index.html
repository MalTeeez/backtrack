<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Find the position of an enemy gun in WARDOGS from video sightings of its shells." />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <title>BACKTRACK</title>
    <script>
      // apply the theme before the first paint (see src/lib/state/theme.svelte.ts)
      (() => {
        let mode = 'system';
        try { mode = localStorage.getItem('backtrack:theme') || 'system'; } catch {}
        const dark = mode === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : mode === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
